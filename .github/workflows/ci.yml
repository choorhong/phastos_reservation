name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Typecheck, unit + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Same four services (Postgres/Redis/RabbitMQ/Kafka) a developer
      # brings up locally -- see PROGRESS.md Step 13 "How to run". The e2e
      # suite boots the real api app in-process (ts-jest, not the webpack
      # build) and drives it over HTTP against these, so nothing here needs
      # `npm run build:all` first.
      - name: Start Postgres/Redis/RabbitMQ/Kafka
        run: docker compose up -d --wait --wait-timeout 180

      - name: Show service status on failure
        if: failure()
        run: docker compose ps

      - run: cp .env.example .env

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run test:e2e

      - name: Service logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-build:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, notification-worker, event-consumer]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build-only, no push -- confirms each Dockerfile still produces a
      # working image (both stages, including the runtime `npm ci
      # --omit=dev`) without needing a registry or credentials.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: phastos-${{ matrix.app }}:ci
