name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Re-run (and so re-deploy) master by hand: Actions > CI > Run workflow.
  workflow_dispatch:

# On master, images are pushed to GitHub Container Registry (ghcr.io) with
# the workflow's own token: nothing to set up. Deploying also needs the
# server (docs/deployment-digitalocean.md): repository variables DEPLOY_HOST
# and DEPLOY_USER, and secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS
# (Settings > Secrets and variables > Actions). Until DEPLOY_HOST is set,
# nothing is deployed.

jobs:
  test:
    name: Typecheck, unit + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Same four services (Postgres/Redis/RabbitMQ/Kafka) a developer
      # brings up locally -- see docs/progress.md Step 13 "How to run". The e2e
      # suite boots the real api app in-process (ts-jest, not the webpack
      # build) and drives it over HTTP against these, so nothing here needs
      # `npm run build:all` first.
      - name: Start Postgres/Redis/RabbitMQ/Kafka
        run: docker compose up -d --wait --wait-timeout 180

      - name: Show service status on failure
        if: failure()
        run: docker compose ps

      - run: cp .env.example .env

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run test:e2e

      - name: Service logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-build:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    env:
      PUSH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      # ghcr.io/<owner>/phastos-<app>; GHCR names must be lowercase.
      IMAGE: ghcr.io/${{ github.repository_owner }}/phastos-${{ matrix.app }}
    strategy:
      matrix:
        include:
          - { app: api, file: apps/api/Dockerfile, target: runtime }
          - { app: notification-worker, file: apps/notification-worker/Dockerfile, target: runtime }
          - { app: event-consumer, file: apps/event-consumer/Dockerfile, target: runtime }
          # One-shot migrations image (docker-compose.prod.yml `migrate`).
          - { app: migrate, file: apps/api/Dockerfile, target: migrate }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull requests this only confirms each Dockerfile still produces a
      # working image. On master it also pushes it to GHCR, tagged with the
      # commit, for the deploy job below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}:{1}', env.IMAGE, github.sha) || format('phastos-{0}:ci', matrix.app) }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # the server pulls this commit's images with this job's token
    # One deploy at a time; a newer push waits rather than cancelling a
    # deploy that's halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The deploy key may only run deploy/ssh-entry.sh on the server
      # (authorized_keys command=...), which accepts exactly
      # "deploy <commit>". The job's token goes over stdin so the server can
      # pull the images; it expires when this job ends.
      - name: Deploy this commit over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" "deploy $GITHUB_SHA"
